<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes · Inventario</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #2c3e50; min-height: 100vh; }

header {
  background: #1a2535;
  color: white;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
header .icon { font-size: 1.5rem; }
header h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.3px; flex: 1; }
.header-links { display: flex; gap: 10px; align-items: center; }
.btn-nav {
  padding: 5px 13px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 5px;
  color: white;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: background .14s;
}
.btn-nav:hover { background: rgba(255,255,255,0.22); }

.container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; }

.search-card {
  background: white;
  border-radius: 10px;
  padding: 18px 22px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
}
.search-row { display: flex; gap: 12px; align-items: center; }
#q {
  flex: 1;
  padding: 10px 15px;
  border: 2px solid #dde3ec;
  border-radius: 7px;
  font-size: 0.95rem;
  outline: none;
  transition: border-color .18s;
  background: #f8f9fb;
}
#q:focus { border-color: #3a85d8; background: white; }
#q::placeholder { color: #a0aab8; }
.result-count { font-size: 0.84rem; color: #7f8c8d; white-space: nowrap; }

.card { background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); overflow: hidden; }

.table-wrap { overflow: auto; max-height: 72vh; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
thead th {
  position: sticky;
  top: 0;
  background: #1a2535;
  color: #cdd8e8;
  padding: 9px 14px;
  white-space: nowrap;
  font-weight: 600;
  font-size: 0.8rem;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  z-index: 1;
  text-align: left;
}
tbody tr { border-bottom: 1px solid #f0f2f5; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f4f7fd; }
tbody td { padding: 8px 14px; white-space: nowrap; color: #2c3e50; }
tbody tr:nth-child(even) { background: #fafbfc; }
tbody tr:nth-child(even):hover { background: #f4f7fd; }
.td-right { text-align: right; }
.td-muted { color: #b0bac8; }

.placeholder { text-align: center; padding: 52px; color: #a0aab8; font-size: 0.92rem; }
.ph-icon { font-size: 2.4rem; display: block; margin-bottom: 10px; opacity: .4; }
.loading-cell { text-align: center; padding: 48px; color: #a0aab8; font-size: 0.92rem; }
.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 3px solid #dde;
  border-top-color: #3a85d8;
  border-radius: 50%;
  animation: spin .75s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-cell { padding: 24px; color: #c0392b; font-size: 0.9rem; text-align: center; }
</style>
</head>
<body>

<header>
  <span class="icon">👥</span>
  <h1>Clientes</h1>
  <div class="header-links">
    <a class="btn-nav" href="/">← Inventario</a>
    <a class="btn-nav" href="/auth/logout">Salir</a>
  </div>
</header>

<div class="container">
  <div class="search-card">
    <div class="search-row">
      <input type="text" id="q"
        placeholder="Buscar por nombre, RFC, teléfono o contacto…"
        autocomplete="off" spellcheck="false" />
      <span class="result-count" id="result-count"></span>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Clave</th>
            <th>Nombre</th>
            <th>RFC</th>
            <th>Teléfono</th>
            <th>Móvil</th>
            <th style="text-align:right">Límite Créd.</th>
            <th style="text-align:right">Días Créd.</th>
            <th>Agente</th>
            <th>Contacto</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody id="tabla-clientes">
          <tr><td colspan="10" class="loading-cell"><span class="spinner"></span>Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let debounceTimer = null;

document.getElementById('q').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(buscar, 350);
});

async function buscar() {
  const q = document.getElementById('q').value.trim();
  const tbody = document.getElementById('tabla-clientes');
  tbody.innerHTML = '<tr><td colspan="10" class="loading-cell"><span class="spinner"></span>Buscando…</td></tr>';
  document.getElementById('result-count').textContent = '';

  try {
    const r = await fetch('/api/clientes?q=' + encodeURIComponent(q));
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json();
    if (!d.ok) {
      tbody.innerHTML = `<tr><td colspan="10" class="error-cell">${esc(d.mensaje)}</td></tr>`;
      return;
    }
    renderTabla(d.clientes);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="10" class="error-cell">Error de conexión: ${esc(err.message)}</td></tr>`;
  }
}

function renderTabla(clientes) {
  const tbody  = document.getElementById('tabla-clientes');
  const count  = document.getElementById('result-count');

  if (!clientes.length) {
    count.textContent = '0 clientes';
    tbody.innerHTML = '<tr><td colspan="10" class="placeholder"><span class="ph-icon">👥</span>No se encontraron clientes</td></tr>';
    return;
  }

  const total = clientes.length;
  count.textContent = total === 200 ? 'más de 200 clientes (afina la búsqueda)' : total + ' ' + (total === 1 ? 'cliente' : 'clientes');

  tbody.innerHTML = clientes.map(c => `
    <tr>
      <td><strong>${esc(c.cve_cte || '')}</strong></td>
      <td>${esc(c.nom_cte || '')}</td>
      <td class="${c.rfc_cte ? '' : 'td-muted'}">${esc(c.rfc_cte || '—')}</td>
      <td class="${c.tel1_cte ? '' : 'td-muted'}">${esc(c.tel1_cte || '—')}</td>
      <td class="${c.movil_cte ? '' : 'td-muted'}">${esc(c.movil_cte || '—')}</td>
      <td class="td-right">${fmtCredito(c.lim_cre)}</td>
      <td class="td-right">${c.dia_cre ? c.dia_cre : '<span class="td-muted">—</span>'}</td>
      <td class="${c.cve_age ? '' : 'td-muted'}">${esc(c.cve_age || '—')}</td>
      <td class="${c.contacto ? '' : 'td-muted'}">${esc(c.contacto || '—')}</td>
      <td class="${c.email_cte ? '' : 'td-muted'}">${esc(c.email_cte || '—')}</td>
    </tr>
  `).join('');
}

function fmtCredito(n) {
  if (n == null || n === 0 || n === '0') return '<span class="td-muted">—</span>';
  return Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

buscar();
</script>
</body>
</html>
