<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso · Consulta de Inventario</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,.10);
  padding: 36px 40px;
  width: 100%;
  max-width: 360px;
}
.logo {
  text-align: center;
  margin-bottom: 28px;
}
.logo-icon { font-size: 2.6rem; display: block; margin-bottom: 10px; }
h1 { font-size: 1.15rem; color: #1a2535; font-weight: 700; }
.subtitle { color: #637083; font-size: 0.84rem; margin-top: 4px; }

label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: #445;
  margin-bottom: 5px;
}
input {
  width: 100%;
  padding: 10px 13px;
  border: 2px solid #dde3ec;
  border-radius: 7px;
  font-size: 0.93rem;
  outline: none;
  background: #f8f9fb;
  margin-bottom: 16px;
  transition: border-color .18s;
}
input:focus { border-color: #3a85d8; background: white; }

button {
  width: 100%;
  padding: 11px;
  background: #1a2535;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
button:hover { background: #253550; }
button:active { transform: scale(0.98); }

.err {
  color: #c0392b;
  font-size: 0.83rem;
  text-align: center;
  background: #fdf2f2;
  border: 1px solid #f5c6c2;
  padding: 9px 12px;
  border-radius: 6px;
  margin-bottom: 16px;
}
.ok {
  color: #1a7a46;
  font-size: 0.83rem;
  text-align: center;
  background: #f0faf4;
  border: 1px solid #b7dfca;
  padding: 9px 12px;
  border-radius: 6px;
  margin-bottom: 16px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">📦</span>
    <h1>Consulta de Inventario</h1>
    <div class="subtitle">Ingresa tus credenciales para continuar</div>
  </div>

  <div id="msg"></div>

  <form method="POST" action="/auth/login">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" required autocomplete="username" autofocus />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" />

    <button type="submit">Entrar</button>
  </form>
</div>

<script>
const p = new URLSearchParams(location.search);
const msg = document.getElementById('msg');
if (p.get('err')) {
  msg.innerHTML = '<div class="err">Usuario o contraseña incorrectos.</div>';
}
if (p.get('ok')) {
  msg.innerHTML = '<div class="ok">Cuenta creada. Ya puedes iniciar sesión.</div>';
}
</script>
</body>
</html>
